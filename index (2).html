<html lang="az">
<head>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1426;--bg2:#13213f;--card:rgba(26,42,77,.62);--tx:#f3efe6;--mut:#c9d4ea;--b:#29b6f6;--r:#ef476f;--g:#6fcf97;--y:#f2b84b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1426;--bg2:#13213f;--tx:#f3efe6}}
:root[data-theme="dark"]{--bg:#0b1426;--bg2:#13213f;--tx:#f3efe6}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{height:100%;background:radial-gradient(circle at 20% 10%,var(--bg2),var(--bg) 70%);color:var(--tx);font-family:Montserrat,Arial,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.slide{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:2.2vh;padding:9vh 7vw 12vh;opacity:0;visibility:hidden;transform:translateX(9%) scale(.97);transition:opacity .8s,transform .8s,visibility .8s;overflow-y:auto}
.slide.prev{transform:translateX(-9%) scale(.97)}
.slide.on{opacity:1;visibility:visible;transform:none}
h1{font-size:clamp(40px,8.4vw,132px);font-weight:800;line-height:1.04}
h2{font-size:clamp(30px,4.8vw,76px);font-weight:800;line-height:1.1;background:linear-gradient(90deg,var(--tx),var(--y),var(--b),var(--tx));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.lead{font-size:clamp(16px,2.1vw,34px);line-height:1.4;color:var(--mut);max-width:1300px}
.tag{font-size:clamp(13px,1.7vw,28px);font-weight:600;letter-spacing:.3em;color:var(--y)}
.rv{opacity:0}
.on .rv{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.14s + .15s)}
.on .pop{animation:pop .9s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0)*.16s + .2s)}
.ch{display:inline-block;opacity:0}
.on .ch{animation:letter .7s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--c)*.045s + .2s)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2vw;margin-top:2vh}
.card{position:relative;background:var(--card);backdrop-filter:blur(8px);border-radius:22px;padding:clamp(18px,2.4vw,40px);border-top:8px solid var(--c);transition:transform .25s,box-shadow .25s;transform-style:preserve-3d;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-120%);animation:sweep 5s ease-in-out infinite;animation-delay:calc(var(--i)*.7s)}
.card:hover{box-shadow:0 20px 60px -10px var(--c)}
.card h3{font-size:clamp(20px,2.4vw,40px);font-weight:700;color:var(--c);margin-bottom:1.2vh}
.card p{font-size:clamp(14px,1.6vw,28px);line-height:1.45}
.card .n{font-size:clamp(14px,1.4vw,22px);font-weight:700;color:var(--c);opacity:.7;margin-bottom:.6vh}
.big{font-size:clamp(70px,13vw,210px);font-weight:800;line-height:1;color:var(--c);text-shadow:0 0 40px var(--c)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:3vw;margin-top:3vh}
.nums p{font-size:clamp(15px,1.9vw,32px);font-weight:600;line-height:1.35}
.tl{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1.5vw;margin-top:5vh;padding-top:34px}
.tl::before{content:"";position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--b),var(--y),var(--r));transform:scaleX(0);transform-origin:left}
.on .tl::before{animation:draw 2.4s ease-out .3s forwards}
.tl .card::before{content:"";position:absolute;left:24px;top:-34px;width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--c);animation:pulse 2s infinite}
.tl .card{overflow:visible;margin-top:14px}.tl .card::after{display:none}
.orb{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
.o1{right:6vw;top:10vh;width:clamp(120px,18vw,280px);height:clamp(120px,18vw,280px);background:var(--r);opacity:.85;animation:float 7s ease-in-out infinite}
.o2{right:20vw;top:32vh;width:clamp(70px,10vw,170px);height:clamp(70px,10vw,170px);background:var(--b);opacity:.85;animation:float 5s ease-in-out infinite reverse}
.o3{right:5vw;top:46vh;width:clamp(40px,6vw,100px);height:clamp(40px,6vw,100px);background:var(--y);animation:float 6s ease-in-out infinite .5s}
.ring{position:absolute;right:calc(6vw - 40px);top:calc(10vh - 40px);width:clamp(200px,26vw,360px);height:clamp(200px,26vw,360px);border:3px dashed var(--y);border-radius:50%;animation:spin 18s linear infinite;z-index:-1;opacity:.6}
.flag{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;pointer-events:none}
.flag i{height:clamp(6px,1.1vh,12px);transform:scaleX(0);transform-origin:left;animation:draw 1.4s ease-out forwards}
.flag i:nth-child(1){background:#00b5e2}.flag i:nth-child(2){background:#ef3340;animation-delay:.2s}.flag i:nth-child(3){background:#509e2f;animation-delay:.4s}
.badge{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:12px 26px;border-radius:40px;background:linear-gradient(90deg,var(--b),var(--g));color:#0b1426;font-weight:700;font-size:clamp(14px,1.7vw,26px);box-shadow:0 0 0 0 var(--b);animation:pulse 2.6s infinite}
.mts{position:absolute;left:0;right:0;bottom:0;width:100%;height:38vh;z-index:-1;opacity:.9}
.mts .m1{animation:drift 14s ease-in-out infinite alternate}.mts .m2{animation:drift 9s ease-in-out infinite alternate-reverse}
.pole{position:absolute;right:12vw;bottom:8vh;width:6px;height:30vh;background:var(--tx);border-radius:3px;z-index:-1}
.pole b{position:absolute;left:6px;top:0;width:clamp(70px,9vw,140px);height:clamp(46px,6vw,90px);background:linear-gradient(#00b5e2 33%,#ef3340 33% 66%,#509e2f 66%);transform-origin:left;animation:wave 1.6s ease-in-out infinite;border-radius:0 6px 6px 0}
.on .pole{animation:flagup 2.2s cubic-bezier(.2,.8,.2,1) both}
#hud{position:fixed;z-index:10;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2.2vh);display:flex;justify-content:center;align-items:center;gap:14px;pointer-events:none}
#hud *{pointer-events:auto}
#hud button{background:rgba(26,42,77,.8);color:var(--tx);border:1px solid rgba(255,255,255,.2);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;transition:transform .2s,background .2s}
#hud button:hover{transform:scale(1.15);background:var(--b);color:#0b1426}
#dots{display:flex;gap:9px}
#dots i{width:10px;height:10px;border-radius:5px;background:rgba(255,255,255,.3);cursor:pointer;transition:all .4s}
#dots i.on{width:34px;background:var(--y)}
#bar{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:5px;background:linear-gradient(90deg,var(--b),var(--y),var(--r));z-index:31;transition:width .8s}
#by{position:fixed;z-index:10;left:2vw;bottom:calc(env(safe-area-inset-bottom,0px) + 3.2vh);font-size:clamp(11px,1.1vw,16px);color:var(--mut);letter-spacing:.08em}
#cnt{position:fixed;z-index:10;right:2vw;bottom:calc(env(safe-area-inset-bottom,0px) + 3.2vh);font-size:clamp(11px,1.1vw,16px);color:var(--mut)}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes letter{from{opacity:0;transform:translateY(80px) rotate(14deg)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:300% 0}}
@keyframes sweep{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes float{50%{transform:translateY(-28px) scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{transform:scaleX(1)}}
@keyframes pulse{70%{box-shadow:0 0 0 18px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes drift{to{transform:translateX(-60px)}}
@keyframes wave{50%{transform:skewY(7deg) scaleX(.93)}}
@keyframes flagup{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

];
